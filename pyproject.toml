[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cti-kernels"
version = "0.0.1"
description = "PyTorch operations for continuous training and inference"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES"]
dependencies = [
    # sglang-kernel does not declare its Torch ABI; qualify this pair together.
    "torch==2.13.0",
    "triton>=3.7.1,<3.8",
    # Fixed-query attention and request-local sampling use private provider helpers.
    "flashinfer-python==0.7.0.post1",
    "sglang-kernel==0.4.6.post1",
    "liger-kernel==0.8.0",
    "apache-tvm-ffi>=0.1.4",
    "quack-kernels==0.6.5",
]

[project.urls]
Repository = "https://github.com/mit-han-lab/cti-kernel"
Issues = "https://github.com/mit-han-lab/cti-kernel/issues"

[project.optional-dependencies]
varlen = ["flash-attn==2.8.3.post1"]
# ctikernels.gdn's provider; the version is pinned exactly.
gdn = ["fla-core==0.5.2"]
# CuTe DSL kernels: the attention prologue's on the RTX 5090 and RTX PRO 6000, ctikernels.gdn's
# training chunk kernels on sm_120 / sm_121, and the NVFP4 GEMMs (ctikernels.linear.nvfp4, with
# quack-kernels 0.6.5); the portable compositions run without it.
cute = ["nvidia-cutlass-dsl[cu13]==4.8.0"]
dev = [
    "numpy>=1.26",
    "build>=1.3,<2",
    "packaging>=24",
    "pre-commit>=4.2,<5",
    "pytest>=6.0",
    "scipy>=1.10", # Exact Clopper-Pearson intervals for GPU sampling qualification.
    "PyYAML>=6,<7",
    "ruff>=0.15,<0.16",
]

[dependency-groups]
cpu-ci = [
    "build>=1.3,<2",
    "packaging>=24",
    "pytest>=6.0",
    "PyYAML>=6,<7",
]

[tool.setuptools]
include-package-data = false
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
include = ["ctikernels*"]
namespaces = false

[tool.setuptools.package-data]
ctikernels = ["csrc/**/*", "_runtime/tables/data/*.json", "moe/flashinfer/tactics/*.json"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # Pyflakes
    "I",  # import sorting
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "ASYNC",  # async correctness
    "BLE001", # blind exception catches
    "G",      # logging format
    "PLW2901", # overwritten loop variables
    "PLE",    # Pylint errors
    "RET503", # inconsistent return paths
    "RUF006", # dangling asyncio tasks
    "RUF100", # unused noqa directives
    "S110",   # silently swallowed exceptions
]
ignore = [
    "E501", # line length is enforced by the formatter where it can rewrite safely
    "E731", # assigned lambdas are idiomatic for Triton launch grids and small callbacks
]

[tool.ruff.lint.isort]
known-first-party = ["ctikernels"]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
markers = [
    "bitwise: fixed-batch decode equality against the frozen product",
    "exhaustive: full parameter sweeps; run in device qualification, deselected by -m \"not exhaustive\"",
    "gpu: needs a CUDA device; op test directories (tests/<op>/) run these in the GPU stage only",
]
testpaths = ["tests/modules", "tests/benchmarks", "tests/quality", "tests/ci", "tests/norm"]
# A test still running after 600 s dumps every thread's stack (a hung child or parent shows where).
faulthandler_timeout = 600
addopts = ["--strict-markers", "--strict-config", "--import-mode=importlib"]
